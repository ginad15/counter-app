<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Counter App</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    @keyframes bump {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .animate-bump {
      animation: bump 0.15s ease-in-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100 flex flex-col items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

  <main class="w-full max-w-md bg-slate-800/80 backdrop-blur-md rounded-3xl p-8 border border-slate-700/60 shadow-2xl shadow-indigo-950/50 text-center relative overflow-hidden">
    
    <!-- Decorative top accent glow -->
    <div class="absolute -top-12 left-1/2 -translate-x-1/2 w-48 h-24 bg-indigo-500/20 rounded-full blur-2xl pointer-events-none"></div>

    <header class="mb-6">
      <span class="inline-block px-3 py-1 bg-indigo-500/10 border border-indigo-500/30 text-indigo-300 text-xs font-semibold rounded-full uppercase tracking-wider mb-2">
        Utility App
      </span>
      <h1 class="text-2xl font-bold text-white tracking-tight">Counter</h1>
      <p class="text-sm text-slate-400 mt-1">Simple, fast, and responsive</p>
    </header>

    <!-- Counter Display Area -->
    <div class="my-8 py-6 px-4 bg-slate-900/70 border border-slate-800 rounded-2xl flex flex-col items-center justify-center min-h-[160px] shadow-inner">
      <span id="counterValue" class="text-7xl font-extrabold tracking-tight text-indigo-400 transition-all duration-150 select-none">
        0
      </span>
      <span id="stepLabel" class="text-xs text-slate-500 mt-2 font-medium">Step size: 1</span>
    </div>

    <!-- Primary Actions -->
    <div class="grid grid-cols-2 gap-4 mb-6">
      <button 
        id="decrementBtn"
        type="button"
        class="group flex items-center justify-center gap-2 py-4 px-6 bg-slate-700/60 hover:bg-rose-600/20 border border-slate-600 hover:border-rose-500/50 text-slate-200 hover:text-rose-400 font-semibold rounded-2xl transition-all duration-150 active:scale-95 focus:outline-none focus:ring-2 focus:ring-rose-500/50"
        aria-label="Decrement count"
      >
        <svg class="w-6 h-6 stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 12H4" />
        </svg>
        <span class="text-lg">Decrease</span>
      </button>

      <button 
        id="incrementBtn"
        type="button"
        class="group flex items-center justify-center gap-2 py-4 px-6 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-600/30 hover:shadow-indigo-500/40 transition-all duration-150 active:scale-95 focus:outline-none focus:ring-2 focus:ring-indigo-400"
        aria-label="Increment count"
      >
        <svg class="w-6 h-6 stroke-current stroke-2" fill="none" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
        <span class="text-lg">Increase</span>
      </button>
    </div>

    <!-- Secondary Controls -->
    <div class="flex items-center justify-between border-t border-slate-700/60 pt-5">
      <button 
        id="resetBtn"
        type="button"
        class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-slate-200 bg-slate-800 hover:bg-slate-700/80 rounded-xl border border-slate-700 transition-colors focus:outline-none focus:ring-2 focus:ring-slate-500"
      >
        Reset to 0
      </button>

      <div class="flex items-center gap-1.5 text-xs text-slate-400">
        <label for="stepSelect" class="text-slate-400">Step:</label>
        <select id="stepSelect" class="bg-slate-800 text-slate-200 border border-slate-700 rounded-lg px-2 py-1 focus:outline-none focus:border-indigo-500 text-xs">
          <option value="1">1</option>
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="100">100</option>
        </select>
      </div>
    </div>

    <footer class="mt-6 text-[11px] text-slate-500">
      Tip: Use <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono text-[10px]">↑</kbd> <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono text-[10px]">↓</kbd> arrow keys or <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300 font-mono text-[10px]">R</kbd> on your keyboard.
    </footer>
  </main>

  <script>
    // App State
    let count = 0;
    let step = 1;

    // DOM Elements
    const counterValueEl = document.getElementById('counterValue');
    const decrementBtn = document.getElementById('decrementBtn');
    const incrementBtn = document.getElementById('incrementBtn');
    const resetBtn = document.getElementById('resetBtn');
    const stepSelect = document.getElementById('stepSelect');
    const stepLabel = document.getElementById('stepLabel');

    // Update Display Helper Function
    function updateDisplay(animate = true) {
      counterValueEl.textContent = count.toLocaleString();
      stepLabel.textContent = `Step size: ${step}`;

      // Dynamically color count based on value
      if (count > 0) {
        counterValueEl.className = 'text-7xl font-extrabold tracking-tight text-emerald-400 transition-all duration-150 select-none';
      } else if (count < 0) {
        counterValueEl.className = 'text-7xl font-extrabold tracking-tight text-rose-400 transition-all duration-150 select-none';
      } else {
        counterValueEl.className = 'text-7xl font-extrabold tracking-tight text-indigo-400 transition-all duration-150 select-none';
      }

      if (animate) {
        counterValueEl.classList.remove('animate-bump');
        // Trigger reflow to restart animation
        void counterValueEl.offsetWidth;
        counterValueEl.classList.add('animate-bump');
      }
    }

    // Increment Handler
    function increment() {
      count += step;
      updateDisplay();
    }

    // Decrement Handler
    function decrement() {
      count -= step;
      updateDisplay();
    }

    // Reset Handler
    function reset() {
      count = 0;
      updateDisplay();
    }

    // Event Listeners for UI Controls
    incrementBtn.addEventListener('click', increment);
    decrementBtn.addEventListener('click', decrement);
    resetBtn.addEventListener('click', reset);

    stepSelect.addEventListener('change', (e) => {
      step = parseInt(e.target.value, 10) || 1;
      updateDisplay(false);
    });

    // Keyboard Shortcuts Support
    document.addEventListener('keydown', (e) => {
      // Prevent shortcut interference if user is interacting with select input
      if (document.activeElement === stepSelect) return;

      if (e.key === 'ArrowUp' || e.key === '+') {
        e.preventDefault();
        increment();
      } else if (e.key === 'ArrowDown' || e.key === '-') {
        e.preventDefault();
        decrement();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        reset();
      }
    });

    // Initial render
    updateDisplay(false);
  </script>
</body>
</html>
